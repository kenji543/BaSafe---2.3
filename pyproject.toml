[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geosafe-fis"
version = "0.5.0"
description = "Focused explainable Web-GIS vulnerability screening prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "networkx>=3.4,<4",
  "pydantic>=2.7,<3",
  "Pillow>=10,<13",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
gis = [
  "pyproj>=3.6,<4",
  "shapely>=2.0,<3",
]
routing-prep = [
  "osmnx>=2.0,<3",
]
hazard-events-prep = [
  "pdfplumber>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["geosafe*"]
